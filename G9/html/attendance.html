<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Log — Group 9</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="attendance.css">
<style id="g9nav-css">
/* ===== G9 navigation: header + burger + overlay drawer ===== */
#g9nav { display: contents; }
.g9-topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 1rem; height: 68px; padding: 0 1.25rem; background: var(--glass-strong); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.g9-topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: linear-gradient(90deg, transparent, var(--cyan), var(--violet), var(--magenta), transparent) 0 0 / 200% 100%; box-shadow: 0 0 14px rgba(34,230,255,.55); animation: g9Flow 6s linear infinite; }
@keyframes g9Flow { to { background-position: 200% 0; } }

/* burger: three stacked lines that morph into an X */
.g9-burger { position: relative; flex: none; width: 52px; height: 46px; padding: 0; border: 1px solid var(--cyan); border-radius: 12px; background: rgba(34,230,255,.08); cursor: pointer; box-shadow: 0 0 16px rgba(34,230,255,.3), inset 0 0 12px rgba(34,230,255,.08); transition: box-shadow .25s, background .25s, transform .15s; animation: g9Pulse 3s ease-in-out infinite; }
@keyframes g9Pulse { 50% { box-shadow: 0 0 26px rgba(34,230,255,.6), inset 0 0 14px rgba(123,92,255,.25); } }
.g9-burger:hover { background: rgba(34,230,255,.16); box-shadow: 0 0 28px rgba(34,230,255,.65); }
.g9-burger:active { transform: scale(.94); }
.g9-burger span { position: absolute; left: 14px; height: 2px; border-radius: 2px; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); transition: top .35s cubic-bezier(.2,.8,.2,1), width .25s, transform .35s cubic-bezier(.2,.8,.2,1), opacity .2s, background .3s; }
.g9-burger span:nth-child(1) { top: 14px; width: 24px; }
.g9-burger span:nth-child(2) { top: 22px; width: 16px; }
.g9-burger span:nth-child(3) { top: 30px; width: 24px; }
.g9-burger:hover span:nth-child(2) { width: 24px; }
.g9-burger[aria-expanded="true"] { animation: none; border-color: var(--magenta); box-shadow: 0 0 22px rgba(255,61,203,.5); }
.g9-burger[aria-expanded="true"] span { background: var(--magenta); box-shadow: 0 0 8px var(--magenta); }
.g9-burger[aria-expanded="true"] span:nth-child(1) { top: 22px; transform: rotate(45deg); }
.g9-burger[aria-expanded="true"] span:nth-child(2) { opacity: 0; width: 0; }
.g9-burger[aria-expanded="true"] span:nth-child(3) { top: 22px; transform: rotate(-45deg); }

.g9-brand { display: flex; align-items: center; gap: .6rem; font-family: var(--font-display); font-weight: 900; font-size: 1.25rem; letter-spacing: .12em; color: #EAFCFF; animation: glow 3.5s ease-in-out infinite; }
.g9-brand::before { content: ""; width: 12px; height: 12px; border: 2px solid var(--cyan); transform: rotate(45deg); box-shadow: 0 0 10px var(--cyan), inset 0 0 6px rgba(255,61,203,.6); }
.g9-crumb { font-family: var(--font-display); font-size: .78rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.g9-crumb::before { content: "/"; margin-right: .8rem; color: var(--magenta); text-shadow: 0 0 10px rgba(255,61,203,.6); }
.g9-status { margin-left: auto; display: flex; align-items: center; gap: .5rem; font-family: var(--font-display); font-size: .62rem; letter-spacing: .2em; text-transform: uppercase; color: var(--ok); }
.g9-status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); animation: blink 1.6s ease-in-out infinite; }
.g9-sound { height: 32px; padding: 0 .8rem; font-family: var(--font-display); font-size: .6rem; letter-spacing: .16em; text-transform: uppercase; color: var(--cyan); border: 1px solid var(--line); border-radius: 999px; background: none; cursor: pointer; transition: border-color .2s, color .2s; }
.g9-sound:hover { border-color: var(--cyan); }
.g9-sound[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
@media (max-width: 560px) { .g9-status, .g9-crumb::before { display: none; } .g9-sound { margin-left: auto; } }

/* overlay: dims and blurs the page behind the drawer */
.g9-scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.5); -webkit-backdrop-filter: blur(0); backdrop-filter: blur(0); opacity: 0; pointer-events: none; transition: opacity .4s, backdrop-filter .4s, -webkit-backdrop-filter .4s; }
.g9-scrim.show { opacity: 1; pointer-events: auto; -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); }

.g9-drawer { position: fixed; top: 0; bottom: 0; left: 0; z-index: 60; width: min(330px, 86vw); display: flex; flex-direction: column; padding: 1.25rem; overflow: hidden; background: var(--glass-strong); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-right: 1px solid var(--cyan); box-shadow: 0 0 48px rgba(34,230,255,.2), 14px 0 44px rgba(0,0,0,.65); transform: translateX(-105%); clip-path: inset(0 100% 0 0); visibility: hidden; transition: transform .45s cubic-bezier(.7,0,.3,1), clip-path .45s cubic-bezier(.7,0,.3,1), visibility 0s .45s; }
.g9-drawer.open { transform: none; clip-path: inset(0); visibility: visible; transition: transform .5s cubic-bezier(.2,.9,.2,1), clip-path .55s cubic-bezier(.2,.9,.2,1), visibility 0s; }
.g9-drawer::before { content: ""; position: absolute; left: 0; right: 0; top: -120px; height: 120px; pointer-events: none; background: linear-gradient(transparent, rgba(34,230,255,.18), transparent); }
.g9-drawer.open::before { animation: g9Scan 1.1s .1s ease-out 1 forwards; }
@keyframes g9Scan { to { transform: translateY(calc(100vh + 120px)); } }
.g9-drawer-head { display: flex; align-items: center; justify-content: space-between; height: 44px; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--line-soft); font-family: var(--font-display); font-size: .72rem; letter-spacing: .22em; text-transform: uppercase; color: var(--cyan); }
.g9-close { width: 36px; height: 36px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: none; color: var(--cyan); font-size: 1.4rem; line-height: 1; cursor: pointer; transition: border-color .2s, box-shadow .2s, transform .3s; }
.g9-close:hover { border-color: var(--cyan); box-shadow: 0 0 14px rgba(34,230,255,.35); transform: rotate(90deg); }

.g9-link, .g9-logout { position: relative; display: flex; align-items: center; gap: .9rem; width: 100%; margin-bottom: .6rem; padding: .85rem 1rem; border: 1px solid var(--line-soft); border-radius: 8px; background: none; color: var(--ink); font: 600 1.1rem var(--font-body); text-align: left; cursor: pointer; transition: border-color .2s, box-shadow .2s, transform .2s, background .2s; }
.g9-link svg, .g9-logout svg { flex: none; width: 22px; height: 22px; fill: none; stroke: var(--cyan); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.g9-link:hover, .g9-link:focus-visible { color: var(--ink); text-shadow: none; border-color: var(--cyan); background: rgba(34,230,255,.06); box-shadow: 0 0 20px rgba(34,230,255,.22); transform: translateX(4px); }
.g9-link[aria-current="page"] { border-color: var(--cyan); background: rgba(34,230,255,.08); }
.g9-link[aria-current="page"]::before { content: ""; position: absolute; left: -1px; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
.g9-logout { margin: 0 0 1rem; border-color: rgba(255,61,203,.4); color: #FFD6F3; }
.g9-logout svg { stroke: var(--magenta); }
.g9-logout:hover, .g9-logout:focus-visible { border-color: var(--magenta); background: rgba(255,61,203,.08); box-shadow: 0 0 22px rgba(255,61,203,.3); transform: translateX(4px); }
.g9-logout:disabled { opacity: .6; cursor: default; transform: none; }
.g9-drawer.open .g9-link, .g9-drawer.open .g9-logout { animation: g9In .5s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i) * 80ms + 160ms); }
@keyframes g9In { from { opacity: 0; transform: translateX(-24px); } }
.g9-bottom { margin-top: auto; }
.g9-foot { padding-top: 1rem; border-top: 1px solid var(--line-soft); font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
</style>
<style id="sd-css">
    .sd-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: .75rem 1rem; margin: .75rem 0; }
    .sd-days { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .4rem; }
    .sd-day { display: inline-flex; align-items: center; gap: .4rem; padding: .4rem .8rem; border: 1px solid var(--line-soft); border-radius: 999px; cursor: pointer; user-select: none; }
    .sd-day:has(input:checked) { border-color: var(--cyan); background: rgba(34,230,255,.1); color: var(--cyan); }
    #setDays .dact { margin-top: 1rem; }
    #cClass { min-width: min(100%, 340px); }
    .stu-pick { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
    .stu-pick .att-in { width: auto; min-width: 220px; }
    .stu-pick .ghost { padding: .65rem .9rem; }
    .dp { scroll-margin-top: 150px; }
    .cell { min-height: 88px; }
    .cell.dim { opacity: 1; }
    .cell.dim > i, .cell.dim > span:not(.evs) { opacity: .5; }
    .cell small.mod { --mc: var(--cyan); font-size: .68rem; font-weight: 700; letter-spacing: .03em; color: var(--mc); text-shadow: 0 0 8px color-mix(in srgb, var(--mc) 45%, transparent); }
    .cell small.mod[data-m="ONLINE"] { --mc: var(--violet); }
    .cell small.mod[data-m="BLENDED"] { --mc: #FFC24D; }
    .cell .evs { display: flex; flex-direction: column; gap: 2px; width: 100%; min-width: 0; font-size: inherit; font-weight: 400; letter-spacing: normal; color: inherit; text-shadow: none; }
    .evs em { --ec: var(--cyan); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 1px 5px; font-style: normal; font-size: .66rem; line-height: 1.5; color: var(--ink); border-left: 3px solid var(--ec); border-radius: 4px; background: color-mix(in srgb, var(--ec) 20%, transparent); }
    .evs em[data-cat="ACTIVITY"] { --ec: var(--violet); }
    .evs em[data-cat="HOLIDAY"] { --ec: var(--magenta); }
    .evs em[data-cat="EXAM"] { --ec: #FFB020; }
    .evs b { font-size: .62rem; font-weight: 600; color: var(--muted); }
    .modes { margin: 0 0 1rem; color: var(--muted); letter-spacing: .06em; }
    .modes .tag { margin-left: .4rem; }
    @media (max-width: 760px) { .cell small.mod, .cell .evs { display: none; } .cell.hasev::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--magenta); box-shadow: 0 0 6px var(--magenta); } }
    @media (min-width: 900px) { .att-bar { position: sticky; top: 76px; z-index: 5; } }
</style>
</head>
<body>
<div id="g9nav">
<header class="g9-topbar">
    <button type="button" class="g9-burger" id="g9Burger" aria-expanded="false" aria-controls="g9Drawer" aria-label="Open navigation"><span></span><span></span><span></span></button>
    <span class="g9-brand">G9</span>
    <span class="g9-crumb">Attendance</span>
    <span class="g9-status">Online</span>
    <button type="button" class="g9-sound" id="g9Sound" aria-pressed="true" aria-label="Toggle menu sound effects">Sound</button>
</header>
<div class="g9-scrim" id="g9Scrim"></div>
<aside class="g9-drawer" id="g9Drawer" aria-label="Site navigation">
    <div class="g9-drawer-head">Navigation<button type="button" class="g9-close" id="g9Close" aria-label="Close navigation">&times;</button></div>
    <nav>
        <a class="g9-link" href="monitoring.html" style="--i:0">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Monitoring
        </a>
        <a class="g9-link" href="studentregistration.html" style="--i:1">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.6-1.6 1.7-2.3 3-2.3s2.4.7 3 2.3M15 10h3M15 14h3"/></svg>Registration
        </a>
        <a class="g9-link" href="attendance.html" style="--i:2" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/></svg>Attendance
        </a>
        <a class="g9-link" href="academiccalendar.html" style="--i:3">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7 14h3M14 14h3M7 17h3"/></svg>Academic calendar
        </a>
    </nav>
    <div class="g9-bottom">
        <button type="button" class="g9-logout" id="g9Logout" style="--i:4">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9"/></svg><span>Log out</span>
        </button>
        <div class="g9-foot">Group 9 · Registration System</div>
    </div>
</aside>
</div>

    <div class="att-app">
        <main>
            <section class="att-hero">
                <div>
                    <h1>Attendance Log</h1>
                    <p id="heroSub"></p>
                </div>
                <div class="att-who" id="who"></div>
            </section>

            <section class="att-card att-bar">
                <div class="seg" id="views" role="tablist" aria-label="View by">
                    <button type="button" data-v="day">Day</button>
                    <button type="button" data-v="month" class="on">Month</button>
                    <button type="button" data-v="semester">Semester</button>
                    <button type="button" data-v="term">Term</button>
                </div>
                <div class="att-nav" id="monthNav">
                    <button type="button" id="prev" aria-label="Previous month">‹</button>
                    <b id="monthLabel"></b>
                    <button type="button" id="next" aria-label="Next month">›</button>
                    <button type="button" id="today" class="ghost">Today</button>
                </div>
                <select id="period" class="att-in" aria-label="Semester or term" hidden></select>
                <label class="att-lbl">Go to date <input type="date" id="jump" class="att-in"></label>
                <div class="att-class" id="stuWrap" hidden>
                    <label class="att-lbl">Class <select id="cClass" class="att-in"></select></label>
                    <div class="att-lbl" id="stuBox"><span>Student</span>
                        <div class="stu-pick">
                            <button type="button" class="ghost" id="stuPrev" aria-label="Previous student" hidden>‹</button>
                            <select id="student" class="att-in" aria-label="Student"></select>
                            <button type="button" class="ghost" id="stuNext" aria-label="Next student" hidden>›</button>
                            <button type="button" class="ghost" id="stuAll" hidden>All students</button>
                        </div>
                    </div>
                </div>
            </section>

            <section id="summary" class="sum" aria-live="polite"></section>
            <section id="view" class="att-card"></section>

            <div class="legend" id="legend"></div>

            <details class="att-card" id="setDays" hidden>
                <summary>Set class days</summary>
                <p class="dsub" id="sdClass"></p>
                <div class="sd-grid">
                    <label class="att-lbl">Status
                        <select id="sdStatus" class="att-in">
                            <option value="REQUIRED">Has class</option><option value="NO_CLASS">No class</option>
                            <option value="HOLIDAY">Holiday</option><option value="CANCELLED">Cancelled</option><option value="OTHER">Other</option>
                        </select>
                    </label>
                    <label class="att-lbl" id="sdModWrap">Modality
                        <select id="sdMod" class="att-in">
                            <option value="FACE_TO_FACE">Face to face</option><option value="ONLINE">Online</option><option value="BLENDED">Blended</option>
                        </select>
                    </label>
                    <label class="att-lbl">Quick range
                        <select id="sdQuick" class="att-in"></select>
                    </label>
                    <label class="att-lbl">From <input type="date" id="sdFrom" class="att-in"></label>
                    <label class="att-lbl">To <input type="date" id="sdTo" class="att-in"></label>
                    <label class="att-lbl">Apply to
                        <select id="sdScope" class="att-in">
                            <option value="class">This section only</option><option value="course">Whole course (every section)</option><option value="all">Everyone (all courses)</option>
                        </select>
                    </label>
                    <label class="att-lbl">Note (optional)<input id="sdNote" class="att-in" maxlength="100"></label>
                </div>
                <div class="att-lbl">Days of the week <div class="sd-days" id="sdDays"></div></div>
                <label class="sd-day"><input type="checkbox" id="sdNotify" checked>Email the affected students about this change</label>
                <div class="dact">
                    <button type="button" class="ghost" id="sdReset">Reset these dates to default</button>
                    <button type="button" class="btn-submit" id="sdApply">Apply</button>
                </div>
            </details>
        </main>
    </div>

    <dialog id="dlg">
        <h3 id="dTitle"></h3>
        <p class="dsub" id="dSub"></p>
        <label class="att-lbl">Class status
            <select id="dClass" class="att-in">
                <option value="REQUIRED">Has class</option><option value="NO_CLASS">No class</option>
                <option value="HOLIDAY">Holiday</option><option value="CANCELLED">Cancelled</option><option value="OTHER">Other</option>
            </select>
        </label>
        <label class="att-lbl" id="dModWrap">Modality
            <select id="dMod" class="att-in">
                <option value="FACE_TO_FACE">Face to face</option><option value="ONLINE">Online</option><option value="BLENDED">Blended</option>
            </select>
        </label>
        <label class="att-lbl">Note (optional)<input id="dNote" class="att-in" maxlength="100"></label>
        <label class="att-lbl">Apply class change to
            <select id="dScope" class="att-in">
                <option value="class">This class only</option><option value="course">Whole course</option><option value="all">Everyone</option>
            </select>
        </label>
        <label class="att-lbl">Student attendance
            <select id="dAtt" class="att-in">
                <option value="">No record</option><option value="PRESENT">Present</option><option value="ABSENT">Absent</option>
                <option value="EXCUSED">Excused</option><option value="EXEMPTED">Exempted</option>
            </select>
        </label>
        <label class="att-lbl" id="dTimeWrap">Time in (optional, only for Present)
            <input type="time" id="dTime" class="att-in">
        </label>
        <label class="sd-day"><input type="checkbox" id="dNotify" checked>Email students if the class status changes</label>
        <div class="dact">
            <button type="button" class="ghost" id="dReset">Reset class day</button>
            <button type="button" class="ghost" id="dCancel">Cancel</button>
            <button type="button" class="btn-submit" id="dSave">Save</button>
        </div>
    </dialog>

    <script src="fx.js"></script>
    <script src="ui.js"></script>
    <script>
(function () {
  'use strict';
  var LOGOUT_URL = '/api/logout';   // change if your server uses a different logout route
  var LOGIN_PAGE = 'login.html';

  var burger = document.getElementById('g9Burger'), drawer = document.getElementById('g9Drawer'),
      scrim = document.getElementById('g9Scrim'), closeBtn = document.getElementById('g9Close'),
      snd = document.getElementById('g9Sound'), out = document.getElementById('g9Logout');

  /* sound: synthesised with Web Audio, no files needed */
  var ctx = null, muted = false;
  try { muted = localStorage.getItem('g9-sound') === 'off'; } catch (e) {}
  function tone(o) {
    if (muted) return;
    var C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    if (!ctx) ctx = new C();
    if (ctx.state === 'suspended') ctx.resume();
    var t = ctx.currentTime + (o.delay || 0), osc = ctx.createOscillator(), g = ctx.createGain(), node = osc;
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.from, t);
    osc.frequency.exponentialRampToValueAtTime(o.to || o.from, t + o.dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol || 0.06, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    if (o.lp) {
      var f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 7;
      f.frequency.setValueAtTime(o.lp[0], t);
      f.frequency.exponentialRampToValueAtTime(o.lp[1], t + o.dur);
      osc.connect(f); node = f;
    }
    node.connect(g); g.connect(ctx.destination);
    osc.start(t); osc.stop(t + o.dur + 0.05);
  }
  var sfx = {
    open: function () {
      tone({ type: 'sawtooth', from: 110, to: 700, dur: .38, vol: .07, lp: [250, 4200] });
      tone({ type: 'sine', from: 880, to: 1760, dur: .16, vol: .05, delay: .14 });
      tone({ type: 'triangle', from: 1320, to: 2640, dur: .12, vol: .04, delay: .28 });
    },
    close: function () {
      tone({ type: 'sawtooth', from: 700, to: 90, dur: .32, vol: .07, lp: [4200, 220] });
      tone({ type: 'sine', from: 1320, to: 550, dur: .16, vol: .05 });
    },
    hover: function () { tone({ type: 'square', from: 1800, to: 2600, dur: .04, vol: .015 }); },
    click: function () {
      tone({ type: 'square', from: 900, to: 1500, dur: .06, vol: .03 });
      tone({ type: 'square', from: 1500, to: 2200, dur: .06, vol: .03, delay: .06 });
    },
    logout: function () {
      tone({ type: 'sine', from: 1500, to: 900, dur: .14, vol: .06 });
      tone({ type: 'sawtooth', from: 600, to: 70, dur: .5, vol: .06, lp: [3000, 150], delay: .1 });
    }
  };

  function isOpen() { return drawer.classList.contains('open'); }
  function setOpen(open, silent) {
    if (open === isOpen()) return;
    drawer.classList.toggle('open', open);
    scrim.classList.toggle('show', open);
    burger.setAttribute('aria-expanded', String(open));
    burger.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
    drawer.inert = !open;
    document.body.style.overflow = open ? 'hidden' : '';
    if (!silent) (open ? sfx.open : sfx.close)();
    if (open) closeBtn.focus({ preventScroll: true });
    else if (drawer.contains(document.activeElement)) burger.focus({ preventScroll: true });
  }

  drawer.inert = true;
  burger.addEventListener('click', function () { setOpen(!isOpen()); });
  closeBtn.addEventListener('click', function () { setOpen(false); });
  scrim.addEventListener('click', function () { setOpen(false); });
  snd.setAttribute('aria-pressed', String(!muted));
  snd.addEventListener('click', function () {
    muted = !muted;
    try { localStorage.setItem('g9-sound', muted ? 'off' : 'on'); } catch (e) {}
    snd.setAttribute('aria-pressed', String(!muted));
    sfx.click();
  });
  drawer.querySelectorAll('.g9-link').forEach(function (a) {
    a.addEventListener('mouseenter', sfx.hover);
    a.addEventListener('click', sfx.click);
  });
  document.addEventListener('keydown', function (e) {
    if (!isOpen()) return;
    if (e.key === 'Escape') { setOpen(false); return; }
    if (e.key === 'Tab') {
      var f = drawer.querySelectorAll('button, a[href]'), first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  window.addEventListener('pageshow', function () { setOpen(false, true); });

  out.addEventListener('click', function () {
    out.disabled = true;
    out.querySelector('span').textContent = 'Signing out…';
    sfx.logout();
    var gone = false;
    function go() { if (gone) return; gone = true; window.location.href = LOGIN_PAGE; }
    try { fetch(LOGOUT_URL, { method: 'POST', credentials: 'same-origin' }).then(go, go); } catch (e) { go(); }
    setTimeout(go, 2500);
  });
})();
</script>
