<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Group 9</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="auth-shell">

        <section class="auth-panel">
            <div>
                <span class="entry-no">Entry desk</span>
                <h1 class="wordmark">G9</h1>
                <p class="tagline">Welcome back. Your entry's already on file.</p>
            </div>
            <p class="stamp">Group 9 · Registration System</p>
        </section>

        <section class="auth-form-panel">
            <div class="auth-form-wrap">

                <nav class="auth-tabs">
                    <button type="button" class="tab is-active" disabled>Sign In</button>
                    <a href="signup.html" class="tab">Sign Up</a>
                </nav>

                <form action="#" method="POST" id="loginForm">
                    <h2>Sign in</h2>
                    <p class="auth-subtext">Enter your details to access your account.</p>

                    <div id="formError" class="form-error" role="alert"></div>

                    <div class="field">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" autocomplete="username" required>
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" autocomplete="current-password" required>
                    </div>

                    <div class="row-between">
                        <label class="check-row" style="margin-bottom:0;">
                            <input type="checkbox" id="remember" name="remember">
                            Remember me
                        </label>
                        <a href="forgotpass.html">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn-submit">Log in</button>
                </form>

            </div>
        </section>

    </main>

    <script src="fx.js"></script>
    <script src="ui.js"></script>
    <script>
        const form = document.getElementById('loginForm');
        const formError = document.getElementById('formError');
        const btn = form.querySelector('.btn-submit');

        const params = new URLSearchParams(window.location.search);
        if (params.get('registered')) {
            G9FX.toast('Account created. Please sign in.', 'success', 5000);
            history.replaceState(null, '', window.location.pathname);
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            formError.style.display = 'none';
            G9FX.busy(btn, true, 'Signing in…');
            let redirecting = false;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value,
                        remember: document.getElementById('remember').checked
                    })
                });
                const data = await res.json().catch(() => ({}));

                if (!res.ok) {
                    formError.textContent = data.message || ('Login failed (HTTP ' + res.status + ')');
                    formError.style.display = 'block';
                    return;
                }

                redirecting = true;
                G9FX.toast('Signed in. Taking you to monitoring…', 'success', 1600);
                setTimeout(() => { window.location.href = data.redirect || 'monitoring.html'; }, 1300);
            } catch (err) {
                formError.textContent = 'Cannot reach the server. Check your connection and try again.';
                formError.style.display = 'block';
            } finally {
                if (!redirecting) G9FX.busy(btn, false);
            }
        });
    </script>

</body>
</html>
