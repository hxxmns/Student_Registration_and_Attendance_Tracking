<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Group 9</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="auth-shell">

        <section class="auth-panel">
            <div>
                <span class="entry-no">Recovery desk</span>
                <h1 class="wordmark">G9</h1>
                <p class="tagline">Locked out? We'll send you a way back in.</p>
            </div>
            <p class="stamp">Group 9 · Registration System</p>
        </section>

        <section class="auth-form-panel">
            <div class="auth-form-wrap">

                <form action="#" method="POST" id="forgotForm">
                    <h2>Forgot password</h2>
                    <p class="auth-subtext">Enter your account email and we'll send a reset link.</p>

                    <div id="formError" class="form-error" role="alert"></div>

                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" maxlength="100" autocomplete="email" required>
                    </div>

                    <button type="submit" class="btn-submit">Send reset link</button>

                    <a href="login.html" class="back-link">← Back to sign in</a>
                </form>

            </div>
        </section>

    </main>

    <script src="fx.js"></script>
    <script src="ui.js"></script>
    <script>
        const form = document.getElementById('forgotForm');
        const formError = document.getElementById('formError');
        const btn = form.querySelector('.btn-submit');

        function cooldown(seconds) {
            btn.disabled = true;
            const label = btn.dataset.label || 'Send reset link';
            const tick = () => {
                if (seconds <= 0) {
                    btn.textContent = label;
                    btn.disabled = false;
                    return;
                }
                btn.textContent = 'Resend in ' + seconds + 's';
                seconds--;
                setTimeout(tick, 1000);
            };
            tick();
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            formError.style.display = 'none';
            G9FX.busy(btn, true, 'Sending…');
            let sent = false;

            try {
                const res = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('email').value })
                });
                const data = await res.json().catch(() => ({}));

                if (!res.ok) {
                    formError.textContent = data.message || 'Could not send the email.';
                    formError.style.display = 'block';
                    return;
                }

                sent = true;
                G9FX.toast(data.message || 'Reset link sent. Check your inbox.', 'success', 6000);
            } catch (err) {
                formError.textContent = 'Cannot reach the server. Check your connection and try again.';
                formError.style.display = 'block';
            } finally {
                G9FX.busy(btn, false);
                if (sent) cooldown(30);
            }
        });
    </script>

</body>
</html>
